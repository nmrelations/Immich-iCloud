name: Build DMG
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: xcodebuild -version

      - run: brew install xcodegen create-dmg

      - run: xcodegen generate

      - name: Run tests
        run: |
          xcodebuild -project Immich-iCloud.xcodeproj -scheme Immich-iCloud test \
            CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" CODE_SIGN_STYLE=Manual

      - name: Build app
        run: |
          xcodebuild -project Immich-iCloud.xcodeproj -scheme Immich-iCloud -configuration Release build \
            CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" CODE_SIGN_STYLE=Manual

      - name: Create DMG
        run: ./Scripts/build_dmg.sh

      - name: Collect DMG
        run: |
          mkdir -p out
          find "$GITHUB_WORKSPACE" "$HOME" /tmp -name "*.dmg" -newer Immich-iCloud.xcodeproj \
            -not -path "*/out/*" -print -exec cp {} out/ \; 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Immich-iCloud-dmg
          path: out/*.dmg
          if-no-files-found: error
